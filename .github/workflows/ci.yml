name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv pip install --system --python ${{ matrix.python-version }} -e ".[dev]"

      - name: ruff
        run: ruff check autogen_goodmem tests

      - name: mypy
        run: mypy autogen_goodmem

      # The live tests need a server and are skipped without credentials;
      # this job runs the offline suite only.
      - name: pytest
        run: pytest -m "not integration"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify the wheel imports in a clean env
        run: |
          uv venv .venv-smoke --python ${{ matrix.python-version }}
          uv pip install --python .venv-smoke/bin/python dist/autogen_goodmem-*.whl
          .venv-smoke/bin/python -c "from autogen_goodmem import GoodMemContextProvider, create_goodmem_search_tool, __version__; print(f'autogen-goodmem {__version__} OK')"
