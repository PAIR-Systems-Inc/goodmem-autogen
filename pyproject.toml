[project]
name = "goodmem-autogen"
version = "0.3.0"
description = "GoodMem memory and tools for the AutoGen agent framework."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PAIR Systems"}]
keywords = ["autogen", "goodmem", "memory", "rag", "agents", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "autogen-core>=0.7.5",
    "goodmem>=0.1.34",
    "pydantic>=2.0,<3",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-timeout",
    "httpx",
    "ruff>=0.6",
    "mypy>=1.11",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/PAIR-Systems-Inc/goodmem-autogen"
Repository = "https://github.com/PAIR-Systems-Inc/goodmem-autogen"
Issues = "https://github.com/PAIR-Systems-Inc/goodmem-autogen/issues"

[tool.ruff]
target-version = "py310"
src = ["goodmem_autogen", "tests"]

[tool.ruff.lint]
extend-select = ["E", "F", "B", "I", "UP", "RUF", "PYI", "TRY", "PERF"]
ignore = ["E501", "TRY003", "TRY300"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: live-server tests (need GOODMEM_BASE_URL and GOODMEM_API_KEY)"]

[build-system]
requires = ["flit-core>=3.11,<4.0"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "goodmem_autogen"
